<!DOCTYPE html>
<html>
  <head>
    <title>Atlantis AR</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.2/aframe/build/aframe-ar-nft.min.js"></script>
    <style>
      body, html {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; gpsMinAccuracy: 100;"
    >
      <a-text
        value="Atlantis"
        look-at="[gps-camera]"
        scale="50 50 50"
        gps-entity-place="latitude: 51.224595; longitude: 2.926617;"
        color="#00FFFF"
      ></a-text>

      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>
  </body>
</html>
